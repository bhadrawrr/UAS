<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f4ee">
    <title>ZPOT — Spot nyaman di Vokasi UI</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #362820;
            --muted: #84766c;
            --accent: #bd6848;
            --accent-dark: #9e4f35;
            --warm-bg: #f7f1e7;
            --paper: #fffaf2;
            --soft-box: #efe2d1;
            --line: #e6d9c8;
            --shadow: 0 18px 50px rgba(70, 48, 34, .1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(ellipse at 12% 8%, rgba(232, 190, 151, .2), transparent 34%),
                radial-gradient(ellipse at 92% 38%, rgba(194, 139, 103, .12), transparent 32%),
                linear-gradient(145deg, #fbf7ef 0%, #f3eadc 52%, #f8f2e9 100%);
            background-attachment: fixed;
            color: var(--ink);
            font-family: "Segoe UI", Arial, sans-serif;
            line-height: 1.6;
        }

        button {
            color: inherit;
            font: inherit;
        }

        .site-header {
            align-items: center;
            display: flex;
            justify-content: space-between;
            margin: 0 auto;
            max-width: 1180px;
            padding: 24px 32px;
        }

        .brand {
            align-items: center;
            color: var(--ink);
            display: inline-flex;
            font-size: 1.45rem;
            font-weight: 800;
            gap: 10px;
            letter-spacing: .12em;
        }

        .brand-mark {
            align-items: center;
            background: linear-gradient(145deg, #d18a67, var(--accent-dark));
            border-radius: 12px;
            color: white;
            display: inline-flex;
            font-size: .95rem;
            height: 38px;
            justify-content: center;
            letter-spacing: 0;
            width: 38px;
        }

        .brand-tagline {
            color: var(--muted);
            display: block;
            font-size: .58rem;
            font-weight: 400;
            letter-spacing: 0;
            line-height: 1;
        }

        .header-note {
            color: var(--muted);
            font-size: .9rem;
        }

        main {
            margin: 0 auto;
            max-width: 1180px;
            padding: 10px 32px 72px;
        }

        .page {
            display: none;
        }

        .page.is-active {
            display: block;
        }

        /* Hero Section dengan Nuansa Hangat Cozy */
        .hero {
            align-items: center;
            background: linear-gradient(128deg, #f2e6d8 0%, #e8d5c1 48%, #f4e9dc 100%);
            border-radius: 30px;
            display: grid;
            gap: 42px;
            grid-template-columns: 1fr 1fr;
            min-height: 510px;
            overflow: hidden;
            padding: 56px 7%;
            position: relative;
        }

        .hero::before {
            background: radial-gradient(circle, rgba(255, 250, 242, .68), rgba(255, 250, 242, 0) 68%);
            content: "";
            height: 370px;
            pointer-events: none;
            position: absolute;
            right: 3%;
            top: -110px;
            width: 370px;
        }

        .hero-copy {
            max-width: 490px;
            position: relative;
            z-index: 1;
        }

        .eyebrow {
            color: var(--accent);
            font-size: .76rem;
            font-weight: 700;
            letter-spacing: .18em;
            margin: 0 0 16px;
            text-transform: uppercase;
        }

        h1, h2, h3, p {
            margin-top: 0;
        }

        .hero h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(3rem, 6vw, 5.3rem);
            font-weight: 500;
            letter-spacing: -.055em;
            line-height: 1.03;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: var(--accent);
            font-style: italic;
        }

        .hero-description {
            color: var(--muted);
            font-size: 1.05rem;
            margin-bottom: 28px;
            max-width: 390px;
        }

        .button {
            background: linear-gradient(135deg, #cf805d 0%, #b85f42 55%, #a95036 100%);
            border: 0;
            border-radius: 999px;
            color: white;
            cursor: pointer;
            font-size: .92rem;
            font-weight: 650;
            padding: 13px 22px;
            transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
        }

        .button:hover {
            background: linear-gradient(135deg, #bd704f 0%, #98482f 100%);
            box-shadow: 0 8px 18px rgba(154, 78, 51, .24);
            transform: translateY(-2px);
        }

        .button:focus-visible, .text-button:focus-visible, .spot-card:focus-visible,
        .close-button:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }

        .hero-art {
            height: 370px;
            position: relative;
        }

        .hero-photo {
            border-radius: 46% 46% 24px 24px;
            height: 100%;
            object-fit: cover;
            position: absolute;
            right: 4%;
            top: 0;
            width: 78%;
        }

        .hero-badge {
            align-items: center;
            background: linear-gradient(145deg, #fffaf2 0%, #f4e9da 100%);
            border-radius: 50%;
            box-shadow: var(--shadow);
            color: var(--accent);
            display: flex;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.12rem;
            height: 104px;
            justify-content: center;
            left: 0;
            line-height: 1.25;
            position: absolute;
            text-align: center;
            top: 46px;
            transform: rotate(-8deg);
            width: 104px;
        }

        .section-heading {
            margin: 56px auto 28px;
            max-width: 660px;
            text-align: center;
        }

        .section-heading h2 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 500;
            letter-spacing: -.035em;
            line-height: 1.15;
            margin-bottom: 12px;
        }

        .section-heading > p:last-child {
            color: var(--muted);
            margin-bottom: 0;
        }

        .option-grid {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(3, 1fr);
        }

        .option-card {
            background: linear-gradient(155deg, #fffdf8 0%, #f8efe3 100%);
            border: 1px solid var(--line);
            border-radius: 22px;
            cursor: pointer;
            min-height: 210px;
            padding: 28px;
            text-align: left;
            transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
        }

        .option-card:hover {
            border-color: #d6c5b4;
            box-shadow: var(--shadow);
            transform: translateY(-4px);
        }

        .option-card h3 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.55rem;
            font-weight: 500;
            margin-bottom: 7px;
        }

        .option-card p {
            color: var(--muted);
            font-size: .9rem;
            margin-bottom: 0;
        }

        .page-toolbar {
            align-items: center;
            display: flex;
            justify-content: space-between;
            margin: 34px 0 14px;
        }

        .text-button {
            background: transparent;
            border: 0;
            color: var(--accent);
            cursor: pointer;
            font-size: .9rem;
            font-weight: 650;
            padding: 8px 0;
        }

        .text-button:hover {
            color: var(--accent-dark);
        }

        .catalog-title {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.2rem, 5vw, 3.6rem);
            font-weight: 500;
            letter-spacing: -.045em;
            margin: 0 0 8px;
        }

        .catalog-intro {
            color: var(--muted);
            margin-bottom: 28px;
        }

        .spot-carousel {
            overflow: hidden;
            padding: 8px 3px 16px;
        }

        .spot-grid {
            display: flex;
            gap: 22px;
            overflow-x: auto;
            overscroll-behavior-inline: contain;
            padding: 2px 2px 12px;
            scroll-behavior: smooth;
            scroll-snap-type: x mandatory;
            scrollbar-color: #c28a6d #eadfce;
            scrollbar-width: thin;
        }

        .spot-card {
            background: linear-gradient(155deg, #fffdf8 0%, #f6eadb 100%);
            border: 1px solid var(--line);
            border-radius: 20px;
            cursor: pointer;
            flex: 0 0 calc((100% - 44px) / 3);
            overflow: hidden;
            padding: 0;
            scroll-snap-align: start;
            text-align: left;
            transition: box-shadow .2s ease, transform .2s ease;
        }

        .spot-card:hover {
            box-shadow: var(--shadow);
            transform: translateY(-4px);
        }

        .spot-card img {
            display: block;
            height: 220px;
            object-fit: cover;
            width: 100%;
        }

        .spot-card-copy {
            background: linear-gradient(145deg, rgba(255, 253, 248, .94), rgba(246, 234, 219, .92));
            padding: 18px 20px 20px;
        }

        .spot-card h3 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.32rem;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .spot-card p {
            color: var(--muted);
            font-size: .9rem;
            margin-bottom: 0;
        }

        .spot-kind {
            color: var(--accent) !important;
            font-size: .72rem !important;
            font-weight: 700;
            letter-spacing: .12em;
            margin-bottom: 7px !important;
            text-transform: uppercase;
        }

        .carousel-controls {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin: 0 2px 4px;
        }

        .carousel-button {
            align-items: center;
            background: linear-gradient(145deg, #fffaf2, #efdfcc);
            border: 1px solid var(--line);
            border-radius: 50%;
            color: var(--accent-dark);
            cursor: pointer;
            display: inline-flex;
            font-size: 1.2rem;
            height: 42px;
            justify-content: center;
            transition: background .2s ease, transform .2s ease, opacity .2s ease;
            width: 42px;
        }

        .carousel-button:hover:not(:disabled) {
            background: linear-gradient(145deg, #f3e4d3, #e6cbb2);
            transform: translateY(-2px);
        }

        .carousel-button:disabled {
            cursor: default;
            opacity: .38;
        }

        .carousel-button:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }

        .modal {
            align-items: center;
            background: rgba(58, 42, 33, .36);
            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);
            display: flex;
            inset: 0;
            justify-content: center;
            opacity: 0;
            padding: 24px;
            position: fixed;
            transition: opacity .2s ease, visibility .2s ease;
            visibility: hidden;
            z-index: 5;
        }

        .modal.is-open {
            opacity: 1;
            visibility: visible;
        }

        .modal-panel {
            background: linear-gradient(155deg, #fffdf8 0%, #f5eadd 100%);
            border-radius: 24px;
            box-shadow: 0 24px 80px rgba(54, 38, 28, .26);
            max-height: min(90vh, 760px);
            max-width: 560px;
            overflow: auto;
            position: relative;
            transform: translateY(12px);
            transition: transform .2s ease;
            width: 100%;
        }

        .modal.is-open .modal-panel {
            transform: translateY(0);
        }

        .modal-photo {
            display: block;
            height: 300px;
            object-fit: cover;
            width: 100%;
        }

        .modal-copy {
            padding: 25px 30px 30px;
        }

        .modal-copy h2 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -.03em;
            margin-bottom: 10px;
        }

        .modal-copy > p:not(.eyebrow) {
            color: var(--muted);
        }

        .spot-location {
            background: linear-gradient(135deg, #f3e7d7, #ead5c0);
            border-radius: 12px;
            color: var(--ink);
            font-size: .88rem;
            margin: 18px 0 0;
            padding: 12px 15px;
        }

        .close-button {
            align-items: center;
            background: rgba(255, 255, 255, .94);
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            font-size: 1.3rem;
            height: 40px;
            justify-content: center;
            position: absolute;
            right: 14px;
            top: 14px;
            width: 40px;
        }

        @media (max-width: 760px) {
            .site-header {
                padding: 18px 20px;
            }

            main {
                padding: 8px 20px 52px;
            }

            .hero {
                gap: 18px;
                grid-template-columns: 1fr;
                padding: 42px 28px 24px;
            }

            .hero-copy {
                max-width: 560px;
            }

            .hero-art {
                height: 280px;
            }

            .hero-photo {
                right: 5%;
                width: 76%;
            }

            .hero-badge {
                height: 82px;
                width: 82px;
            }

            .option-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .spot-card {
                flex-basis: calc((100% - 22px) / 2);
            }

            .spot-card img {
                height: 190px;
            }
        }

        @media (max-width: 520px) {
            .header-note {
                font-size: .76rem;
            }

            .hero {
                border-radius: 22px;
                padding: 34px 22px 18px;
            }

            .hero-art {
                height: 230px;
            }

            .section-heading {
                margin-top: 42px;
            }

            .option-grid {
                grid-template-columns: 1fr;
            }

            .spot-card {
                flex-basis: 82%;
            }

            .option-card {
                min-height: 170px;
            }

            .option-number {
                margin-bottom: 14px;
            }

            .spot-card img {
                height: 230px;
            }

            .modal {
                padding: 14px;
            }

            .modal-photo {
                height: 230px;
            }

            .modal-copy {
                padding: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

    <header class="site-header">
        <div class="brand">

    </header>

    <main>

            <div class="hero">

                    <h1 id="hero-title">ZPOT</h1>
                    <p class="hero-description">ZZZ spot you can find at Sekolah VOKASI UI</p>
                    <button class="button" id="check-spots" type="button">Check a spot! <span aria-hidden="true">→</span></button>
                </div>
                <div class="hero-art">
                    <img class="hero-photo" src="https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&amp;fit=crop&amp;w=1000&amp;q=85" alt="">
                </div>
            </div>
        </section>

        <section class="page" id="options-page" aria-labelledby="options-title">
            <div class="page-toolbar">
                <button class="text-button" type="button" data-page="home">Home</button>
            </div>
            <div class="section-heading">

            </div>

        <section class="page" id="catalog-page" aria-labelledby="catalog-title">
            <div class="page-toolbar">

                <button class="text-button" type="button" data-page="home">Home</button>
            </div>
            <h2 class="catalog-title" id="catalog-title"></h2>
            <p class="catalog-intro" id="catalog-intro"></p>
            <div class="carousel-controls">

            </div>
            <div class="spot-carousel">
                <div class="spot-grid" id="spot-grid"></div>
            </div>
        </section>
    </main>

    <div class="modal" id="spot-modal" aria-hidden="true">

            <img class="modal-photo" id="modal-photo" src="" alt="">
            <div class="modal-copy">
                <p class="eyebrow" id="modal-kind"></p>
                <h2 id="modal-title"></h2>
                <p id="modal-description"></p>
                <p class="spot-location" id="modal-location"></p>

        let lastFocusedElement = null;

        function showPage(pageId) {
            pages.forEach(function (page) {
                page.classList.toggle("is-active", page.id === pageId);
            });
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function renderOptions() {
            optionGrid.innerHTML = "";

            options.forEach(function (option) {
                const card = document.createElement("button");
                card.className = "option-card";
                card.type = "button";
                card.innerHTML =
                    "<h3>" + option.name + "</h3>" +
                    "<p>" + option.description + "</p>";
                card.addEventListener("click", function () {
                    showCatalog(option);
                });
                optionGrid.appendChild(card);
            });
        }

        function showCatalog(option) {
            document.getElementById("catalog-title").textContent = option.name;
            document.getElementById("catalog-intro").textContent = option.description;
            spotGrid.innerHTML = "";

            option.spots.forEach(function (spot) {
                const card = document.createElement("button");
                card.className = "spot-card";
                card.type = "button";
                card.setAttribute("aria-label", spot.name);

                const image = document.createElement("img");
                image.src = spot.image;
                image.alt = "[Foto spot]";
                image.loading = "lazy";

                const copy = document.createElement("div");
                copy.className = "spot-card-copy";

                const kind = document.createElement("p");
                kind.className = "spot-kind";
                kind.textContent = option.name;

                const title = document.createElement("h3");
                title.textContent = spot.name;

                const info = document.createElement("p");
                info.textContent = spot.info;

                copy.append(kind, title, info);
                card.append(image, copy);
                card.addEventListener("click", function () {
                    openModal(option.name, spot);
                });
                spotGrid.appendChild(card);
            });

            showPage("catalog-page");
            updateCarouselControls();
        }

        function updateCarouselControls() {
            const maxScrollLeft = spotGrid.scrollWidth - spotGrid.clientWidth;
            scrollLeftButton.disabled = spotGrid.scrollLeft <= 1;
            scrollRightButton.disabled = spotGrid.scrollLeft >= maxScrollLeft - 1;
        }

        function scrollSpots(direction) {
            spotGrid.scrollBy({
                left: direction * spotGrid.clientWidth * .85,
                behavior: "smooth"
            });
        }

        function openModal(area, spot) {
            lastFocusedElement = document.activeElement;
            document.getElementById("modal-photo").src = spot.image;
            document.getElementById("modal-photo").alt = "[Foto spot]";
            document.getElementById("modal-kind").textContent = area;
            document.getElementById("modal-title").textContent = spot.name;
            document.getElementById("modal-description").textContent = spot.description;
            document.getElementById("modal-location").textContent = spot.location;
            modal.classList.add("is-open");
            modal.setAttribute("aria-hidden", "false");
            document.body.style.overflow = "hidden";
            document.getElementById("close-modal").focus();
        }

        function closeModal() {
            modal.classList.remove("is-open");
            modal.setAttribute("aria-hidden", "true");
            document.body.style.overflow = "";
            if (lastFocusedElement) {
                lastFocusedElement.focus();
            }
        }

        document.getElementById("check-spots").addEventListener("click", function () {
            showPage("options-page");
        });

        document.getElementById("back-to-options").addEventListener("click", function () {
            showPage("options-page");
        });

        scrollLeftButton.addEventListener("click", function () {
            scrollSpots(-1);
        });

        scrollRightButton.addEventListener("click", function () {
            scrollSpots(1);
        });

        spotGrid.addEventListener("scroll", updateCarouselControls);
        window.addEventListener("resize", updateCarouselControls);

        document.querySelectorAll("[data-page='home']").forEach(function (button) {
            button.addEventListener("click", function () {
                showPage("home-page");
            });
        });

        document.getElementById("close-modal").addEventListener("click", closeModal);
        modal.addEventListener("click", function (event) {
            if (event.target === modal) {
                closeModal();
            }
        });

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape" && modal.classList.contains("is-open")) {
                closeModal();
            }
        });

        renderOptions();
    </script>
</body>
</html>
